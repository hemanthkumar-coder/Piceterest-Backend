version: '3.8'

services:
  picterest-api:
    image: picterest
    container_name: picterest-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__ImageConnection: "Host=postgres;Port=5432;Database=picterest;Username=postgres;Password=${DB_PASSWORD}"
      SeaweedFS__ServiceUrl: "http://seaweedfs:8333"
      SeaweedFS__AccessKey: "${SEAWEED_ACCESS_KEY}"
      SeaweedFS__SecretKey: "${SEAWEED_SECRET_KEY}"
      Jwt__Key: "${JWT_KEY}"
      Jwt__Issuer: "Picterest"
      Jwt__Audience: "PicterestClient"
      Jwt__AccessTokenExpiryMinutes: "60"
      githubClientId: "${GITHUB_CLIENT_ID}"
      ClientSecret: "${GITHUB_CLIENT_SECRET}"
      RedirectUrl: "${GITHUB_REDIRECT_URL}"
      PublicApiBaseUrl: "${PUBLIC_API_BASE_URL}"
      origins: "http://localhost:5173"
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    networks:
      - picterest-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:15-alpine
    container_name: picterest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: picterest
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - picterest-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: picterest-seaweedfs
    restart: unless-stopped
    command: >
      server
      -dir=/data
      -s3
      -s3.config=/etc/seaweedfs/s3.json

    ports:
      - "9333:9333"
      - "8080:8080"
      - "8888:8888"
      - "8333:8333"
    volumes:
      - ./seaweedfs/data:/data
      - ./seaweedfs/config:/etc/seaweedfs
    networks:
      - picterest-network

networks:
  picterest-network:
    driver: bridge

volumes:
  postgres_data:
  seaweedfs_data:
